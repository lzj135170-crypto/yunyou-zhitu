# 向量库容器：PostgreSQL 16 + pgvector 扩展。
#
# 为什么向量库要单独一个容器，而不是把 pgvector 装进项目已经在用的那台
# native PostgreSQL：pgvector 是 PG 的原生扩展，必须落在安装目录的
# lib/ 和 share/extension/ 下（PG16 还没有 PG18 才有的 extension_control_path，
# 没有"装到别处"的绕法）。而 C:\Program Files\PostgreSQL\16 需要管理员权限才能写，
# 从源码编译还要额外几个 GB 的 VS Build Tools。
#
# 容器化之后这两个问题一起消失，而且带来一个额外好处：
# 这个库是【派生物】不是主存储——里面只有 document_chunks 和 chunk_terms 两张表，
# 内容全部能从 knowledge/ 下的 Markdown 重新灌出来。
# 所以装坏了、改错了、想重来，`docker compose down -v` 再 up 就行，
# 不用像业务库那样小心翼翼。
#
# 业务库那台 native PostgreSQL（5432）一个字不动。

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: travel-pgvector

    environment:
      POSTGRES_USER: postgres

      # ⚠️ 密码【不写死在文件里】。本文件是要进版本库的，
      # 密码一旦提交就永远留在 git 历史里——后续把这个文件改掉也没用，
      # 历史提交里那份原样躺着，任何能 clone 的人都能翻出来。
      #
      # 值从同目录的 .env 读：Compose 会自动加载 compose 文件旁边的 .env
      # （而 .env 已经在 .gitignore 里，不会进版本库）。
      # 照着 .env.example 复制一份填写即可。
      #
      # 用 :? 而不是 :- 是刻意的：没设置时【直接报错退出】，
      # 而不是回退到一个空密码或默认密码把库建出来。
      # 静默用弱密码建库这种事，等到发现的时候数据已经在里面了。
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?向量库密码未设置：把 deploy/pgvector/.env.example 复制成 .env 并填写 PGVECTOR_PASSWORD}

      POSTGRES_DB: travel_vector

    ports:
      # 宿主机 5433 → 容器 5432。
      # 用 5433 而不是 5432，是因为 5432 已经被业务库的 native PostgreSQL 占了。
      # 映射到不同的端口，两条连接串在配置里一眼能区分开。
      # 只绑回环地址，避免把向量库直接暴露到局域网/公网。
      - "127.0.0.1:5433:5432"

    volumes:
      # 具名卷，不是绑定挂载：数据放在 Docker 的数据盘里（已配到 D 盘），
      # 不进项目目录，也就不会被 .gitignore 之外的任何东西误伤。
      - pgvector_data:/var/lib/postgresql/data

    # Docker Desktop 重启（开机、切代理、崩溃恢复）后容器自动回来。
    # 不写这条的话，某次重启后检索会【静默降级】成关键词匹配——
    # app/rag/vector_store.py 的 60 秒重试会让它看起来只是"慢了一会儿"，
    # 而不是"向量库根本没起来"，这种排查很费劲。
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_vector"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgvector_data:
